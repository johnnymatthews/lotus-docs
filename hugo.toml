# Basic info.
# -----------
baseURL = "/"
title = "Lotus Docs"
theme = "grundlagen"
languageCode = "en-us"
# -----------



# Output formats for search index.
# --------------------------------
[outputs]
  home = ["HTML", "JSON"]

[outputFormats.JSON]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = true
# --------------------------------



# Customizable parameters.
# ------------------------
[params]
  description = "This website contains all the information you need to spin up a Lotus node, become a Filecoin storage provider, or just tinker around with the Filecoin network!"
  author = "FilOz"

  # Code block features
  [params.code_blocks]
    copy_button = true  # Enable copy button on code blocks
    border = true       # Show border around code blocks (default: true)

  # Theme colors
  [params.colors.light]
    primary = "#0969da"           # Link color, buttons, highlights
    text_primary = "#1c2128"      # Main text color
    text_secondary = "#57606a"    # Secondary text (descriptions, meta)
    bg_primary = "#ffffff"        # Main background
    bg_secondary = "#f6f8fa"      # Sidebar, code blocks, alternate backgrounds
    border = "#d1d9e0"            # Borders and dividers
    code_bg = "#f6f8fa"           # Code block background
    code_border = "#d1d9e0"       # Code block borders

  [params.colors.dark]
    primary = "#58a6ff"           # Link color, buttons, highlights
    text_primary = "#c9d1d9"      # Main text color
    text_secondary = "#8b949e"    # Secondary text (descriptions, meta)
    bg_primary = "#0d1117"        # Main background
    bg_secondary = "#161b22"      # Sidebar, code blocks, alternate backgrounds
    border = "#30363d"            # Borders and dividers
    code_bg = "#161b22"           # Code block background
    code_border = "#30363d"       # Code block borders

  # Social links
  [params.social]
    github = "https://example.com"
    twitter = "https://example.com"
    slack = "https://example.com"
# ------------------------



